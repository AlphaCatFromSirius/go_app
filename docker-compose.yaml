name: backend

x-environment: &db-env
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_PORT: ${POSTGRES_PORT}

services:
  db:
    image: postgres:18.4
    hostname: postgres
    restart: always
    environment:
      <<: *db-env
    ports:
      - "5432:5432"
    volumes:
      - pg_volume:/var/lib
    networks:
      - db_net
  
  server:
    image: go_app:v0.3
    hostname: backend
    restart: always
    environment:
      <<: *db-env
    ports:
      - "8888:8888"
    networks:
      - db_net
    healthcheck:
      test: ["CMD", "curl", "localhost:8888/healthcheck"]
      interval: 30s 
      timeout: 10s
      retries: 5

volumes:
  pg_volume:

networks:
  db_net:
    driver: bridge
